<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ello · Sistema de Gestão — Studio Bella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4F0; --panel:#FFFFFF; --ink:#1D2023; --ink-soft:#6B7076; --ink-faint:#9A9EA3;
    --red:#C43B2F; --red-soft:#F5E1DE; --green:#3E7A5C; --green-soft:#DEEAE3;
    --amber:#B97A2E; --amber-soft:#F4E6D2; --line:#E6E2DA; --line-strong:#D7D2C7;
    --radius:14px; --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}

  .topbar{display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 28px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{display:flex;align-items:baseline;font-family:var(--font-display);font-size:22px;letter-spacing:0.5px;}
  .brand-mark .ello{font-weight:700;color:var(--ink);} .brand-mark .ia{font-weight:500;color:var(--red);margin-left:1px;}
  .brand-divider{width:1px;height:22px;background:var(--line-strong);}
  .brand-sub{font-size:13px;color:var(--ink-soft);}
  .demo-pill{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--red);background:var(--red-soft);padding:3px 9px;border-radius:100px;margin-left:12px;text-transform:uppercase;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .topbar-search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:7px 14px;width:200px;}
  .topbar-search svg{width:15px;height:15px;stroke:var(--ink-faint);fill:none;stroke-width:1.8;flex-shrink:0;}
  .topbar-search input{border:none;background:transparent;outline:none;font-family:var(--font-body);font-size:13px;width:100%;color:var(--ink);}
  .topbar-search input::placeholder{color:var(--ink-faint);}
  .icon-btn-round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--ink-soft);flex-shrink:0;transition:all .15s ease;}
  .icon-btn-round:hover{border-color:var(--ink);color:var(--ink);}
  .icon-btn-round svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .notif-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--panel);}
  .avatar-round{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;flex-shrink:0;cursor:pointer;}
  .client-tag{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
  .client-dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
  .client-tag strong{color:var(--ink);font-weight:600;}

  .layout{display:flex;min-height:calc(100vh - 68px);}
  .sidebar{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;}
  .nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;margin:16px 10px 8px;display:flex;align-items:center;gap:7px;}
  .nav-group-label:first-child{margin-top:2px;}
  .tag-custom{background:var(--red-soft);color:var(--red);font-size:9.5px;padding:2px 7px;border-radius:100px;text-transform:none;letter-spacing:0;font-weight:700;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;margin-bottom:3px;font-size:14px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:background .2s ease, color .2s ease;}
  .nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0;}
  .nav-item:hover{background:var(--paper);color:var(--ink);}
  .nav-item.active{background:var(--red-soft);color:var(--red);font-weight:600;} .nav-item.active svg{stroke:var(--red);}
  .nav-item .custom-dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0;margin-left:auto;}

  .main{flex:1;padding:32px 36px 60px;min-width:0;}
  .page-head{margin-bottom:22px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .page-title{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-0.01em;}
  .page-sub{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}

  .hero-banner{position:relative;height:180px;border-radius:var(--radius);overflow:hidden;margin-bottom:22px;background:var(--ink);}
  .hero-banner img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(29,32,35,0) 35%, rgba(20,18,16,0.8) 100%);display:flex;align-items:flex-end;padding:20px 24px;}

  .btn-primary{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-family:var(--font-body);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s ease;white-space:nowrap;flex-shrink:0;}
  .btn-primary:hover{background:#000;}
  .btn-primary svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.3;}
  .btn-secondary{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:9px;padding:8px 15px;font-family:var(--font-body);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s ease;white-space:nowrap;}
  .btn-secondary:hover{border-color:var(--ink);}
  .btn-row{display:flex;gap:10px;flex-shrink:0;}

  .icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin-right:4px;color:var(--ink-soft);transition:all .15s ease;}
  .icon-btn:hover{border-color:var(--ink);color:var(--ink);}
  .icon-btn.danger:hover{border-color:var(--red);color:var(--red);}
  .icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .actions-cell{display:flex;gap:0;white-space:nowrap;}

  .module-banner{background:var(--red-soft);border:1px solid #EBC9C4;color:var(--red);font-size:13px;font-weight:600;padding:11px 16px;border-radius:11px;margin-bottom:20px;display:flex;align-items:center;gap:9px;}
  .module-banner svg{width:16px;height:16px;stroke:var(--red);fill:none;stroke-width:2;flex-shrink:0;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
  .kpi-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .kpi-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .kpi-label{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-bottom:9px;}
  .kpi-value{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-0.01em;}
  .kpi-value.receber{color:var(--green);} .kpi-value.pagar{color:var(--red);}
  .kpi-meta{margin-top:11px;} .meta-track{height:5px;background:var(--paper);border-radius:100px;overflow:hidden;}
  .meta-fill{height:100%;background:var(--ink);border-radius:100px;} .meta-text{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}

  .row{display:grid;gap:16px;margin-bottom:16px;} .row-main{grid-template-columns:1.55fr 1fr;} .row-half{grid-template-columns:1fr 1fr;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;}
  .panel-title{font-family:var(--font-display);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .panel-title .sub{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--ink-soft);}

  .chart-wrap{position:relative;} .chart-months{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:8px;padding:0 6px;}

  .agenda-list{display:flex;flex-direction:column;gap:2px;}
  .agenda-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);} .agenda-item:last-child{border-bottom:none;}
  .agenda-time{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--ink-soft);width:44px;flex-shrink:0;}
  .agenda-info{flex:1;min-width:0;} .agenda-title{font-size:13.5px;font-weight:600;} .agenda-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .status-pill{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:100px;white-space:nowrap;text-transform:uppercase;letter-spacing:0.02em;}
  .status-confirmado{background:var(--green-soft);color:var(--green);} .status-pendente{background:var(--amber-soft);color:var(--amber);}
  .status-atencao{background:var(--red-soft);color:var(--red);} .status-andamento{background:#E7E9EC;color:var(--ink-soft);}
  .status-emdia{background:var(--green-soft);color:var(--green);} .status-vencendo{background:var(--amber-soft);color:var(--amber);}
  .status-atrasada{background:var(--red-soft);color:var(--red);} .status-atrasado{background:var(--red-soft);color:var(--red);}
  .status-pago{background:var(--green-soft);color:var(--green);} .status-frequente{background:var(--green-soft);color:var(--green);}
  .status-novo{background:#E7E9EC;color:var(--ink-soft);} .status-inativo{background:var(--amber-soft);color:var(--amber);}

  .cat-list{display:flex;flex-direction:column;gap:14px;} .cat-row{display:flex;align-items:center;gap:12px;}
  .cat-label{font-size:12.5px;font-weight:500;width:120px;flex-shrink:0;color:var(--ink-soft);}
  .cat-track{flex:1;height:8px;background:var(--paper);border-radius:100px;overflow:hidden;} .cat-fill{height:100%;background:var(--ink);border-radius:100px;}
  .cat-value{font-family:var(--font-display);font-size:12.5px;font-weight:600;width:64px;text-align:right;flex-shrink:0;}

  .alert-list{display:flex;flex-direction:column;gap:12px;} .alert-item{display:flex;gap:10px;align-items:flex-start;}
  .alert-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0;} .alert-dot.amber{background:var(--amber);} .alert-dot.red{background:var(--red);}
  .alert-text{font-size:13px;line-height:1.45;}

  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;border-bottom:1px solid var(--line-strong);}
  table.data td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;} table.data tr:last-child td{border-bottom:none;}
  table.data .num{font-family:var(--font-display);font-weight:600;}

  .chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px;}
  .chip{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s ease;text-align:left;font-family:var(--font-body);}
  .chip:hover{border-color:var(--ink);} .chip-name{font-size:13px;font-weight:600;} .chip-price{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .cart{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;} .cart-empty{font-size:13px;color:var(--ink-faint);padding:10px 0;}
  .cart-item{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;}
  .cart-total{display:flex;justify-content:space-between;font-family:var(--font-display);font-weight:700;font-size:16px;padding-top:10px;margin-top:6px;border-top:1px dashed var(--line-strong);}
  .pay-row{display:flex;gap:8px;margin-top:14px;}
  .pay-btn{flex:1;border:1px solid var(--line-strong);background:var(--panel);border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
  .pay-btn:hover{border-color:var(--ink);color:var(--ink);}

  .week-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;}
  .day-col{flex:1;min-width:150px;background:var(--paper);border-radius:12px;padding:12px;}
  .day-head{font-family:var(--font-display);font-size:12.5px;font-weight:700;margin-bottom:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .day-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;font-size:12px;}
  .day-card .t{font-family:var(--font-display);font-weight:600;font-size:12px;} .day-card .s{color:var(--ink-soft);margin-top:2px;}

  .entity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .entity-card{border:1px solid var(--line);border-radius:12px;padding:16px;}
  .entity-avatar{width:42px;height:42px;border-radius:50%;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:10px;}
  .entity-name{font-family:var(--font-display);font-size:15px;font-weight:600;}
  .entity-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;margin-bottom:12px;}
  .entity-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:6px 0;border-top:1px solid var(--line);} .entity-row:first-of-type{border-top:none;}

  .auto-list{display:flex;flex-direction:column;gap:14px;}
  .auto-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;}
  .auto-name{font-family:var(--font-display);font-size:14.5px;font-weight:600;}
  .auto-trigger{font-size:12.5px;color:var(--ink-soft);margin-top:3px;margin-bottom:12px;}
  .bubble{background:#DCF3D8;border-radius:10px 10px 10px 2px;padding:9px 12px;font-size:12.5px;max-width:340px;line-height:1.4;color:#1B2A1A;}
  .toggle{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
  .toggle input{opacity:0;width:0;height:0;}
  .toggle-track{position:absolute;inset:0;background:#D8D4CC;border-radius:100px;cursor:pointer;transition:.2s;}
  .toggle-track:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .toggle input:checked + .toggle-track{background:var(--green);} .toggle input:checked + .toggle-track:before{transform:translateX(18px);}

  footer{text-align:center;padding:26px 20px 10px;font-size:11.5px;color:var(--ink-faint);} footer strong{color:var(--ink-soft);}

  .hamburger-btn{display:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0;}
  .hamburger-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;}
  .drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(20,18,16,0.42);z-index:90;opacity:0;transition:opacity .2s ease;}
  .drawer-backdrop.open{display:block;opacity:1;}

  @media (max-width:960px){
    .hamburger-btn{display:flex;}
    .topbar-search{display:none;}
    .sidebar{
      display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;width:78vw;max-width:280px;
      transform:translateX(-100%);transition:transform .25s ease;z-index:100;box-shadow:2px 0 28px rgba(0,0,0,0.18);
      overflow-y:auto;
    }
    .sidebar.open{transform:translateX(0);}
    .row-main, .row-half{grid-template-columns:1fr;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .chip-grid{grid-template-columns:repeat(2,1fr);}
    .entity-grid{grid-template-columns:1fr;}
    .main{padding:20px 16px 60px;}
    .panel{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table.data{min-width:520px;}
    .icon-btn{width:33px;height:33px;}
    .page-head{flex-direction:column;align-items:stretch;gap:12px;}
    .btn-primary, .btn-secondary{width:100%;justify-content:center;padding:11px 16px;}
    .client-tag{display:none;}
  }
  @media (max-width:480px){
    .kpi-grid, .kpi-grid.cols-3{grid-template-columns:1fr 1fr;}
    .brand-sub, .brand-divider, .demo-pill{display:none;}
    .topbar{padding:0 16px;}
    .topbar-right{gap:8px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menu" type="button">
    <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke-linecap="round"/><line x1="4" y1="17" x2="20" y2="17" stroke-linecap="round"/></svg>
  </button>
  <div class="brand">
    <div class="brand-mark"><span class="ello">ELLO</span><span class="ia">IA</span></div>
    <div class="brand-divider"></div>
    <div class="brand-sub">Sistema de Gestão</div>
    <span class="demo-pill">Demo</span>
  </div>
  <div class="topbar-right">
    <div class="topbar-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5" stroke-linecap="round"/></svg>
      <input type="text" placeholder="Buscar cliente, OS, agendamento...">
    </div>
    <div class="icon-btn-round" title="Notificações">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Z" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19a2 2 0 0 0 4 0" stroke-linecap="round"/></svg>
      <span class="notif-dot"></span>
    </div>
    <div class="client-tag"><span class="client-dot"></span> Implantado para <strong>Studio Bella</strong></div>
    <div class="avatar-round" title="Conta">SB</div>
  </div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<footer>
  Protótipo demonstrativo com dados fictícios · <strong>Ello Consultoria de IA</strong> — Grupo Agape Empresarial<br>
  Sistemas que vestem seu negócio sob medida.
</footer>

<script>
const fmt = n => n.toLocaleString('pt-BR', {style:'currency', currency:'BRL', minimumFractionDigits:0, maximumFractionDigits:0});
const statusLabels = {confirmado:"Confirmado", pendente:"Pendente", atencao:"Atenção", andamento:"Em andamento"};

function agendaHTML(items){
  return items.map(a => `
    <div class="agenda-item">
      <div class="agenda-time">${a.time}</div>
      <div class="agenda-info"><div class="agenda-title">${a.title}</div><div class="agenda-sub">${a.sub}</div></div>
      <div class="status-pill status-${a.status}">${statusLabels[a.status] || a.status}</div>
    </div>`).join('');
}
function catHTML(items){
  return items.map(c => `
    <div class="cat-row">
      <div class="cat-label">${c.label}</div>
      <div class="cat-track"><div class="cat-fill" style="width:${(c.value/c.max*100).toFixed(0)}%"></div></div>
      <div class="cat-value">${c.isPercent ? c.value+'%' : fmt(c.value)}</div>
    </div>`).join('');
}
function buildChartPath(values){
  const w=560,h=200,padT=14,padB=14;
  const max = Math.max(...values)*1.08, min = Math.min(...values)*0.9;
  const stepX = w/(values.length-1);
  const pts = values.map((v,i)=>{ const x=i*stepX, y=padT+(h-padT-padB)*(1-(v-min)/(max-min)); return [x,y]; });
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i], cx=(x0+x1)/2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  const area = d + ` L${pts[pts.length-1][0]},${h} L${pts[0][0]},${h} Z`;
  return {d, area, pts};
}
function drawChart(svgId, monthsId, values, months){
  const svg = document.getElementById(svgId); if(!svg) return;
  const {d:path, area, pts} = buildChartPath(values);
  svg.innerHTML = `
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C43B2F" stop-opacity="0.14"/><stop offset="100%" stop-color="#C43B2F" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#areaGrad)" />
    <path d="${path}" fill="none" stroke="#1D2023" stroke-width="2.2" stroke-linecap="round"/>

  if(monthsEl) monthsEl.innerHTML = months.map(m=>`<span>${m}</span>`).join('');
}

function renderSidebar(){
  const groups = {base: navItems.filter(n=>n.group==='base'), custom: navItems.filter(n=>n.group==='custom')};
  let html = `<div class="nav-group-label">Sistema base</div>`;
  html += groups.base.map(n => `
    <div class="nav-item${n.key===navItems[0].key?' active':''}" data-page="${n.key}">
      <svg viewBox="0 0 24 24">${n.icon}</svg> ${n.label}
    </div>`).join('');
  if(groups.custom.length){
    html += `<div class="nav-group-label">Módulos personalizados <span class="tag-custom">Salão de Beleza</span></div>`;
    html += groups.custom.map(n => `
      <div class="nav-item" data-page="${n.key}">
        <svg viewBox="0 0 24 24">${n.icon}</svg> ${n.label} <span class="custom-dot"></span>
      </div>`).join('');
  }
  document.getElementById('sidebar').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      renderPage(item.dataset.page);
      closeDrawer();
    });
  });
}
function openDrawer(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('drawerBackdrop').classList.add('open'); }
function closeDrawer(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('drawerBackdrop').classList.remove('open'); }
document.addEventListener('DOMContentLoaded', () => {
  const hb = document.getElementById('hamburgerBtn');
  const bd = document.getElementById('drawerBackdrop');
  if(hb) hb.addEventListener('click', openDrawer);
  if(bd) bd.addEventListener('click', closeDrawer);
});
function renderPage(key){
  document.getElementById('main').innerHTML = pages[key] ? pages[key]() : '<p>Página não configurada.</p>';
  if(key === 'dashboard'){
    drawChart('chart-svg', 'chart-months', [17200,18400,19100,21300,22600,24100], ["Mar","Abr","Mai","Jun","Jul","Ago"]);
  }
  if(key === 'vendas'){
    cart = [];
    const cartEl = document.getElementById('cart');
    if(cartEl) cartEl.innerHTML = '<div class="cart-empty">Clique em um item para adicionar à venda.</div>';
  }
}
let cart = [];
function renderCart(){
  const el = document.getElementById('cart'); if(!el) return;
  if(cart.length === 0){ el.innerHTML = '<div class="cart-empty">Clique em um item para adicionar à venda.</div>'; return; }
  const total = cart.reduce((s,i)=>s+i.price,0);
  el.innerHTML = `${cart.map(i=>`<div class="cart-item"><span>${i.name}</span><span>${fmt(i.price)}</span></div>`).join('')}
    <div class="cart-total"><span>Total</span><span>${fmt(total)}</span></div>
    <div class="pay-row"><button type="button" class="pay-btn">Pix</button><button type="button" class="pay-btn">Cartão</button><button type="button" class="pay-btn">Dinheiro</button></div>`;
}
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  cart.push({name: chip.dataset.name, price: Number(chip.dataset.price)});
  renderCart();
});
document.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  if(navItems.length) renderPage(navItems[0].key);
});
